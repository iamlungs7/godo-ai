<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GODO AI — Reset Password</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🔐 Reset Password</h1>

        <p>
            Enter your GODO AI account email address.
        </p>

        <form id="forgotPasswordForm">

            <input
                type="email"
                id="forgotEmail"
                placeholder="Email address"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <p id="forgotMessage"></p>

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>

<script src="js/forgot-password.js"></script>

</body>
</html>
