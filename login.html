<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GODO AI Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

<div class="logo">
    <a href="index.html">
        <img src="images/godo-ai-logo-small.png" alt="GODO AI">
    </a>
</div>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="core.html">Core</a></li>
<li><a href="system.html">System Engine</a></li>
<li><a href="hybrid.html">Hybrid</a></li>
<li><a href="notifier.html">Notifier</a></li>
<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<main class="login-page">

<div class="login-content">

<img
    src="images/godo-ai-logo.png"
    alt="GODO AI"
    class="login-logo"
>

<h2>GODO AI ACCESS</h2>

<h3>Secure Platform Gateway</h3>

<p>
Access the GODO AI intelligence platform,
trading systems and monitoring dashboard.
</p>

<form class="login-card" id="loginForm">

<label for="email">Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label for="password">Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit" class="btn-primary">
    Enter GODO AI
</button>

<p id="loginMessage">🔥 LOGIN PAGE V2</p>

</form>

<div class="hero-buttons">

<a href="register.html" class="btn-primary">
Create GODO AI Account
</a>

</div>

<div class="hero-buttons">

<a href="index.html" class="btn-secondary">
← Back Home
</a>

</div>

</div>

</main>

<script src="js/login.js?v=3"></script>

</body>

</html>
