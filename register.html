<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GODO AI Register</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

<div class="logo">
    <a href="index.html">
        <img src="images/godo-ai-logo-small.png" alt="GODO AI">
    </a>
</div>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="core.html">Core</a></li>
<li><a href="system.html">System Engine</a></li>
<li><a href="hybrid.html">Hybrid</a></li>

<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>

<main class="login-page">

<div class="login-content">

<img
    src="images/godo-ai-logo.png"
    alt="GODO AI"
    class="login-logo"
>

<h2>CREATE GODO AI ACCOUNT</h2>

<h3>Join The Intelligence Platform</h3>

<p>
Create your GODO AI account to access the
platform, trading intelligence and monitoring systems.
</p>

<form class="login-card" id="registerForm">

<label for="name">Full Name</label>

<input
    type="text"
    id="name"
    placeholder="Enter your full name"
    required
>

<label for="email">Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label for="phone">Phone Number</label>

<input
    type="tel"
    id="phone"
    placeholder="Enter your phone number"
    autocomplete="tel"
    required
>


<label for="country">Country</label>

<input
    type="text"
    id="country"
    placeholder="Enter your country"
    autocomplete="country-name"
    required
>


<label for="region">Region / Province</label>

<input
    type="text"
    id="region"
    placeholder="Enter your region or province"
    autocomplete="address-level1"
    required
>


<label for="city">City</label>

<input
    type="text"
    id="city"
    placeholder="Enter your city"
    autocomplete="address-level2"
    required
>


<label for="identityNumber">ID Number</label>

<input
    type="text"
    id="identityNumber"
    placeholder="Enter your ID number"
    inputmode="numeric"
    autocomplete="off"
    required
>


<label for="password">Password</label>

<input
    type="password"
    id="password"
    placeholder="Create a password"
    autocomplete="new-password"
    required
>

<label for="confirmPassword">Confirm Password</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm your password"
    required
>

<button type="submit" class="btn-primary">
    Create Account
</button>

<p id="registerMessage"></p>

</form>

<div class="hero-buttons">

<a href="login.html" class="btn-secondary">
Already Have An Account? Login
</a>

<a href="index.html" class="btn-secondary">
← Back Home
</a>

</div>

</div>

</main>

<script src="js/register.js"></script>

</body>

</html>
